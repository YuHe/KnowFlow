[pytest]
asyncio_mode = auto
# Pin the fixture loop scope explicitly. pytest-asyncio 1.x warns that this
# default will change; the warning is currently invisible because
# PytestDeprecationWarning subclasses DeprecationWarning, which is ignored
# below. Fixtures here are function-scoped, so make that the contract.
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
